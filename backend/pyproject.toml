[project]
name = "gridfinity-tracer-backend"
version = "0.1.0"
description = "Photo of tools on paper -> Gridfinity holder (STL/3MF/STEP)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "pillow-heif>=0.18",
  "shapely>=2.0",
  "onnxruntime>=1.18",
  "rembg>=2.0.60",
  "huggingface_hub>=0.24",
  "build123d>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
