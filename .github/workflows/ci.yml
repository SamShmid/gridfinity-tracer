name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npx vite build
      # Advisory only: a new upstream advisory should not block unrelated changes.
      - run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # No model weights on CI: the tests that need SAM / IS-Net skip themselves.
      GT_MODELS_DIR: ${{ github.workspace }}/.ci-no-models
      U2NET_HOME: ${{ github.workspace }}/.ci-no-models/u2net
    steps:
      - uses: actions/checkout@v7
      # Same runtime libs the Dockerfile installs (OpenCascade / opencv-headless).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxrender1 libxext6 libsm6 libgomp1 libfontconfig1
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock
      - name: Install (pinned runtime from the hashed lock, then dev tools)
        run: |
          uv venv --python 3.12
          uv pip install --require-hashes -r requirements.lock
          uv pip install -e ".[dev]"
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q

  docker:
    # Builds the real image and boots it, so base-image and dependency bumps are actually tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gridfinity-tracer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot without model weights and hit /api/health
        run: |
          docker run -d --name gt -p 8000:8000 -e GT_SKIP_MODEL_DOWNLOAD=1 gridfinity-tracer:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root"'
      - if: failure()
        run: docker logs gt
