services:
  tracer:
    build: .
    image: gridfinity-tracer:local
    container_name: gridfinity-tracer
    ports:
      # Reachable from EVERY device on your network, with no login: the library (photos, models,
      # delete) is shared by design (see README, "Who can reach it"). To keep it to this machine only:
      #   - "127.0.0.1:8080:8000"
      - "8080:8000"
    volumes:
      - models:/models   # ~330 MB of ONNX weights, downloaded on first start
      - data:/data       # library: originals, working images, exports, SQLite
    environment:
      - GT_PX_PER_MM=4
      - GT_RECTIFY_MARGIN_MM=25
      # Retention (days). Projects untouched this long are deleted by the daily sweep.
      - GT_RETENTION_DAYS=90
      - GT_ORPHAN_DAYS=7
      - GT_BLANK_DAYS=1
      # - GT_MAX_UPLOAD_MB=50
      # - GT_SKIP_MODEL_DOWNLOAD=1   # start without trying to download weights at all
    restart: unless-stopped
    # Healthcheck comes from the Dockerfile (HEALTHCHECK); not repeated here so the two cannot drift.
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  models:
  data:
